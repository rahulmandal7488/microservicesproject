server:
  port: 3333

spring:
  cloud:
    gateway:
      routes:

        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/employees/**

        - id: department-service
          uri: lb://department-service
          predicates:
            - Path=/departments/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
